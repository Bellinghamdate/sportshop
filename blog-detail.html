<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bài viết – Sport Zone</title>
  <link rel="stylesheet" href="css/main.css"/>
  <style>
    .blog-article { max-width: 760px; margin: 0 auto; padding: 48px 0 80px; }
    .blog-cover { aspect-ratio: 16/9; border-radius: var(--radius-lg); overflow: hidden; background: var(--gray-100); display: flex; align-items: center; justify-content: center; font-size: 6rem; margin-bottom: 36px; }
    .blog-cover img { width: 100%; height: 100%; object-fit: cover; }
    .blog-article-meta { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
    .blog-article-title { font-size: clamp(1.6rem, 4vw, 2.4rem); font-weight: 900; color: var(--navy); line-height: 1.25; margin-bottom: 20px; }
    .blog-article-excerpt { font-size: 1.1rem; color: var(--gray-600); line-height: 1.8; margin-bottom: 32px; border-left: 4px solid var(--blue); padding-left: 20px; font-style: italic; }
    .blog-content { font-size: 1rem; line-height: 1.9; color: var(--gray-800); }
    .blog-content h2 { font-size: 1.5rem; font-weight: 800; color: var(--navy); margin: 36px 0 14px; }
    .blog-content h3 { font-size: 1.2rem; font-weight: 700; color: var(--navy); margin: 28px 0 10px; }
    .blog-content p { margin-bottom: 16px; }
    .blog-content ul, .blog-content ol { margin: 0 0 16px 24px; }
    .blog-content li { margin-bottom: 8px; }
    .blog-content strong { color: var(--navy); }
    .blog-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--gray-200); }
    .blog-tag { padding: 4px 12px; background: var(--gray-100); border-radius: var(--radius-pill); font-size: 0.8rem; color: var(--gray-600); }
    .related-wrap { background: var(--gray-50); padding: 60px 0; }
    .related-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; margin-top: 28px; }
    .related-card { background: var(--white); border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--gray-200); transition: var(--transition); }
    .related-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
    .related-card-img { aspect-ratio: 16/9; overflow: hidden; background: var(--gray-100); display: flex; align-items: center; justify-content: center; font-size: 2.5rem; }
    .related-card-img img { width: 100%; height: 100%; object-fit: cover; }
    .related-card-body { padding: 16px; }
    .related-card-title { font-weight: 700; color: var(--navy); font-size: 0.95rem; line-height: 1.4; margin-bottom: 6px; }
    .related-card-title a:hover { color: var(--blue); }
    .related-card-meta { font-size: 0.8rem; color: var(--gray-600); }
    .progress-bar { position: fixed; top: 0; left: 0; height: 3px; background: var(--blue); z-index: 2000; transition: width 0.1s linear; width: 0%; }
  </style>
</head>
<body data-page="blog-detail">
<!-- Thanh tiến trình đọc bài -->
<div class="progress-bar" id="readProgress"></div>

<div id="header-placeholder"></div>

<!-- Loading -->
<div id="loadingWrap" class="container spinner-wrap"><div class="spinner"></div></div>

<!-- Nội dung bài viết -->
<div id="articleWrap" class="hidden">
  <div class="container">
    <div class="breadcrumb">
      <a href="index.html" data-i18n="nav.home">Trang chủ</a><span>/</span>
      <a href="blog.html" data-i18n="blog.title"></a><span>/</span>
      <span id="breadcrumbTitle">...</span>
    </div>
    <article class="blog-article">
      <div class="blog-cover" id="blogCover"></div>
      <div class="blog-article-meta">
        <span class="badge badge--blue" id="blogCat"></span>
        <span style="color:var(--gray-600);font-size:0.85rem" id="blogAuthor"></span>
        <span style="color:var(--gray-400)">•</span>
        <span style="color:var(--gray-600);font-size:0.85rem" id="blogDate"></span>
        <span style="color:var(--gray-400)">•</span>
        <span style="color:var(--gray-600);font-size:0.85rem" id="blogReadTime"></span>
      </div>
      <h1 class="blog-article-title" id="blogTitle"></h1>
      <blockquote class="blog-article-excerpt" id="blogExcerpt"></blockquote>
      <div class="blog-content" id="blogContent"></div>
      <div class="blog-tags" id="blogTags"></div>

      <!-- Share & Back -->
      <div style="margin-top:36px;padding-top:24px;border-top:1px solid var(--gray-200);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px">
        <a href="blog.html" class="btn btn--outline" data-i18n="blog.back"></a>
        <div style="display:flex;gap:8px">
          <button id="copyLink" class="btn btn--outline btn--sm" data-i18n="blog.copy"></button>
        </div>
      </div>
    </article>
  </div>

  <!-- Bài viết liên quan -->
  <div class="related-wrap">
    <div class="container">
      <h2 style="color:var(--navy)" data-i18n="blog.related"></h2>
      <div class="related-grid" id="relatedGrid"></div>
    </div>
  </div>
</div>

<!-- Error -->
<div class="container hidden" id="errorWrap" style="text-align:center;padding:80px 20px">
  <div style="font-size:4rem">😕</div>
  <h2 style="margin:16px 0 8px" id="blogError" data-i18n="blog.missing"></h2>
  <a href="blog.html" class="btn btn--primary" style="margin-top:16px" data-i18n="blog.back"></a>
</div>

<div id="footer-placeholder"></div>

<script type="module" src="js/blog.js"></script>
</body>
</html>
