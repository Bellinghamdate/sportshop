<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Giỏ hàng – Sport Zone</title>
  <link rel="stylesheet" href="css/main.css"/>
  <style>
    .cart-layout { display: grid; grid-template-columns: 1fr 360px; gap: 32px; padding: 48px 0 80px; align-items: start; }
    .cart-table { width: 100%; border-collapse: collapse; }
    .cart-table th { text-align: left; padding: 12px 16px; border-bottom: 2px solid var(--gray-200); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--gray-600); }
    .cart-table td { padding: 16px; border-bottom: 1px solid var(--gray-100); vertical-align: middle; }
    .cart-product-img { width: 72px; height: 72px; border-radius: var(--radius-sm); background: var(--gray-50); border: 1px solid var(--gray-200); display: flex; align-items: center; justify-content: center; font-size: 2rem; overflow: hidden; flex-shrink: 0; }
    .cart-product-img img { width: 100%; height: 100%; object-fit: cover; }
    .cart-product-info { display: flex; align-items: center; gap: 16px; }
    .cart-product-name { font-weight: 700; color: var(--navy); }
    .cart-product-size { font-size: 0.8rem; color: var(--gray-600); margin-top: 2px; }
    .qty-control { display: flex; align-items: center; gap: 0; border: 2px solid var(--gray-200); border-radius: var(--radius-sm); overflow: hidden; width: fit-content; }
    .qty-btn { width: 34px; height: 34px; border: none; background: var(--gray-50); cursor: pointer; font-size: 1rem; display: grid; place-items: center; transition: var(--transition); }
    .qty-btn:hover { background: var(--blue); color: var(--white); }
    .qty-num { width: 40px; text-align: center; font-weight: 700; border: none; outline: none; font-family: var(--font); font-size: 0.95rem; }
    .cart-remove { background: none; border: none; color: var(--gray-400); cursor: pointer; font-size: 1.2rem; padding: 4px; border-radius: 4px; transition: var(--transition); }
    .cart-remove:hover { color: var(--red); background: rgba(230,57,70,0.08); }
    .cart-summary { background: var(--white); border: 1px solid var(--gray-200); border-radius: var(--radius-md); padding: 28px; position: sticky; top: 88px; }
    .cart-summary h3 { font-size: 1.1rem; font-weight: 800; color: var(--navy); margin-bottom: 20px; padding-bottom: 14px; border-bottom: 2px solid var(--gray-100); }
    .summary-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 0.95rem; }
    .summary-row.total { border-top: 2px solid var(--gray-200); margin-top: 12px; padding-top: 16px; font-size: 1.1rem; font-weight: 800; color: var(--navy); }
    .summary-note { font-size: 0.8rem; color: var(--blue); margin-top: 4px; }
    .cart-empty { text-align: center; padding: 80px 20px; }
    .cart-empty .icon { font-size: 5rem; margin-bottom: 20px; }
    @media (max-width: 900px) { .cart-layout { grid-template-columns: 1fr; } .cart-summary { position: static; } }
    @media (max-width: 600px) { .cart-table thead { display: none; } .cart-table td { display: flex; padding: 8px 12px; border: none; } .cart-table tr { display: block; border-bottom: 1px solid var(--gray-200); padding: 12px 0; } }
  </style>
</head>
<body>
<div id="header-placeholder"></div>

<section class="page-hero">
  <div class="container">
    <h1 data-i18n="cart.title"></h1>
  </div>
</section>

<div class="container">
  <!-- Giỏ trống -->
  <div id="cartEmpty" class="cart-empty hidden">
    <div class="icon">🛒</div>
    <h2 data-i18n="cart.empty"></h2>
    <p style="color:var(--gray-600);margin:8px 0 24px" data-i18n="cart.empty_desc"></p>
    <a href="products.html" class="btn btn--primary btn--lg" data-i18n="cart.continue"></a>
  </div>

  <!-- Giỏ có hàng -->
  <div id="cartContent" class="cart-layout hidden">
    <div>
      <div style="background:var(--white);border:1px solid var(--gray-200);border-radius:var(--radius-md);overflow:hidden">
        <table class="cart-table">
          <thead>
            <tr>
              <th data-i18n="cart.product"></th>
              <th data-i18n="cart.price"></th>
              <th data-i18n="cart.qty"></th>
              <th data-i18n="cart.total"></th>
              <th data-i18n="cart.action"></th>
            </tr>
          </thead>
          <tbody id="cartTableBody"></tbody>
        </table>
      </div>
      <div style="margin-top:16px;display:flex;gap:12px;flex-wrap:wrap">
        <a href="products.html" class="btn btn--outline" data-i18n="cart.continue"></a>
        <button class="btn btn--outline" id="clearCartBtn" style="color:var(--red);border-color:var(--red)" data-i18n="cart.clear"></button>
      </div>
    </div>

    <!-- Tóm tắt đơn -->
    <div class="cart-summary">
      <h3 data-i18n="checkout.order_summary"></h3>
      <div class="summary-row">
        <span data-i18n="cart.subtotal"></span>
        <span id="summarySubtotal">0đ</span>
      </div>
      <div class="summary-row">
        <div>
          <div data-i18n="cart.shipping"></div>
          <div class="summary-note" data-i18n="cart.shipping_note"></div>
        </div>
        <span id="summaryShipping">0đ</span>
      </div>
      <div class="summary-row total">
        <span data-i18n="cart.order_total"></span>
        <span id="summaryTotal" style="color:var(--navy)">0đ</span>
      </div>
      <a href="checkout.html" class="btn btn--primary btn--block btn--lg" style="margin-top:20px" data-i18n="cart.checkout"></a>
      <div style="text-align:center;margin-top:12px;font-size:0.8rem;color:var(--gray-600)">
        <span data-i18n="checkout.demo"></span>
      </div>
    </div>
  </div>
</div>

<div id="footer-placeholder"></div>

<script type="module" src="js/cart.js"></script>
</body>
</html>
