<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bảng size · Sport Zone</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/shop.css">
  </head>
  <body data-page="size-guide">
    <div id="header-placeholder"></div>
    <main>
      <header class="page-hero">
        <div class="container">
          <h1 data-i18n="size.title"></h1>
          <p data-i18n="size.desc"></p>
        </div>
      </header>
      <div class="container shop-columns">
        <section class="shop-panel">
          <h2 data-i18n="size.measure"></h2>
          <p data-i18n="size.instructions"></p>
          <form class="shop-form" id="sizeForm">
            <label>
              <span data-i18n="size.input_label"></span>
              <input id="cm" type="number" step="any" min="22" max="29" placeholder="25.5" required>
            </label>
            <p data-i18n="size.range"></p>
            <button class="btn btn--primary" data-i18n="size.btn"></button>
          </form>
          <output id="sizeResult" class="size-result" aria-live="polite"></output>
        </section>
        <section class="shop-panel">
          <h2 data-i18n="size.chart"></h2>
          <p data-i18n="size.reference"></p>
          <table class="size-table">
            <thead>
              <tr>
                <th data-i18n="size.cm"></th>
                <th>VN</th>
                <th>US</th>
                <th>EU</th>
              </tr>
            </thead>
            <tbody id="sizeRows"></tbody>
          </table>
        </section>
      </div>
    </main>
    <div id="footer-placeholder"></div>
    <script type="module" src="js/size-guide.js"></script>
  </body>
</html>
